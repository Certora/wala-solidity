name: Dispatch Private Tests

on:
  workflow_run:
    workflows: ["Test RoundAbout"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: private-tests-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
        github.event.workflow_run.event == 'pull_request'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check PR label
        id: check-label
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -n "$PR_NUMBER" ] && gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name' \
            | grep -qx "run-private-tests"; then
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate app token
        id: app-token
        if: github.event.workflow_run.event == 'push' || steps.check-label.outputs.should_dispatch == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SECURE_APP_ID }}
          private-key: ${{ secrets.SECURE_APP_PRIVATE_KEY }}
          owner: Certora
          repositories: roundabout-tests

      - name: Dispatch roundabout-tests workflow
        if: github.event.workflow_run.event == 'push' || steps.check-label.outputs.should_dispatch == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          payload=$(jq -n \
            --arg sha "$SHA" \
            --arg branch "$BRANCH" \
            --arg source_repo "$SOURCE_REPO" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            '{
              event_type: "wala-solidity-updated",
              client_payload: {
                sha: $sha,
                branch: $branch,
                source_repo: $source_repo,
                source_run_id: $source_run_id
              }
            }')
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Certora/roundabout-tests/dispatches \
            -d "$payload"
